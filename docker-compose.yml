services:
  api:
    build: .
    container_name: rag-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - APP_MODE=api
    command: uv run uvicorn app.api:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    container_name: rag-ui
    env_file:
      - .env
    ports:
      - "8501:8501"
    environment:
      - APP_MODE=api
      - API_URL=http://api:8000/query
    depends_on:
      - api
    command: uv run streamlit run ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501